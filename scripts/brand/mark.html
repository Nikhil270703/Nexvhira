<!doctype html>
<!--
  The Nexvhira mark on its own, used for favicon-32.png, apple-touch-icon.png and logo.png.
  build-assets.py sets ?size=N&bleed=0|1 via the URL: bleed=1 fills the whole canvas with navy
  (no transparent corners, needed for the iOS home-screen icon).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .wrap {
        width: 100vw;
        height: 100vh;
        display: grid;
        place-items: center;
      }
      body.bleed .wrap {
        background: #0b1d36;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect id="tile" width="40" height="40" rx="9" fill="#0B1D36" />
        <path id="n" d="M12 29V12l15 16" fill="none" stroke="#E8F1F4" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
        <path id="arrow" d="M27 28V11.5M22.4 16 27 11.4 31.6 16" fill="none" stroke="#5EE0CF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get('bleed') === '1') {
        document.body.classList.add('bleed');
        document.getElementById('tile').setAttribute('rx', '0');
      }
      const stroke = params.get('stroke');
      if (stroke) {
        document.getElementById('n').setAttribute('stroke-width', stroke);
        document.getElementById('arrow').setAttribute('stroke-width', stroke);
      }
    </script>
  </body>
</html>
